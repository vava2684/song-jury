[pytest]
# NOTE: keep this file ASCII-only.
# Traditional-Chinese Windows reads .ini as cp950; UTF-8 comments here made
# `python -m pytest` fail with UnicodeDecodeError before collection even started.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
