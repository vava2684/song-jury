name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 這個 CI 刻意 **不裝那四個重量級 venv**(torch / demucs / SongEval 合計十幾 GB)。
# 它測的是「接線與邏輯」—— 而這個專案出過的 bug 幾乎全部都在接線與邏輯上:
# 打包漏檔、取值鍵名寫錯、快取撞名、分數沒夾範圍、缺柱被當成正常分數、失敗時偷用舊報告。

jobs:
  test:
    name: 測試(${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 打包檢查要用 git ls-files

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 裝測試相依(輕量;⛔ 不裝那四個重量級 venv)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt

      - name: 跑測試
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests -q

  mutation:
    name: 變異驗證(證明測試不是裝飾品)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt
      - name: 把真實 bug 塞回去,確認測試會失敗
        env:
          PYTHONUTF8: "1"
        run: python tests/變異驗證.py

  mutation-windows:
    # ⛔ Windows 專屬的變異(Job handle / venv layout / PowerShell 退出碼)在 ubuntu
    #    一律誠實跳過 —— 只有 ubuntu 的變異工作時,「兩平台合起來全覆蓋」其實是
    #    「ubuntu CI + 某次人工 Windows 執行」。這個工作把那幾條變成每次 commit 的證據。
    name: 變異驗證(Windows 專屬那幾條)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt
      - name: 只跑 win32 專屬的變異
        env:
          PYTHONUTF8: "1"
        run: python tests/變異驗證.py --only-platform win32

  lint:
    name: 語法與腳本檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 所有 Python 檔都要能編譯
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path(".").glob("*.py")) + sorted(pathlib.Path("tests").glob("*.py")):
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  bad.append(f"{p}:{e.lineno} {e.msg}")
          print("\n".join(bad) if bad else f"OK：{len(list(pathlib.Path('.').glob('*.py')))} 個檔")
          sys.exit(1 if bad else 0)
          PY

      - name: bash 安裝腳本語法
        run: bash -n install.sh

      - name: PowerShell 安裝腳本語法
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
                    "$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "install.ps1 OK"

      - name: 換行檢查(.sh 不可有 CR、.bat 必須是 CRLF)
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          # 只檢查真的進 repo 的檔(本機可能有沒被追蹤的內部資料夾)
          tracked = subprocess.run(["git", "-c", "core.quotepath=false", "ls-files"],
                                   capture_output=True, text=True).stdout.split()
          bad = []
          for f in tracked:
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              b = p.read_bytes()
              if p.suffix == ".sh" and b"\r" in b:
                  bad.append(f"{p} 含 CR → Linux 會噴 'bash: \\r: command not found'")
              if p.suffix == ".bat" and b"\n" in b and b"\r\n" not in b:
                  bad.append(f"{p} 是 LF → cmd 會碎字")
          print("\n".join(bad) if bad else "換行 OK")
          sys.exit(1 if bad else 0)
          PY
